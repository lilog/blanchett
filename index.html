<style>
  :root {
    --negro: #000000;
    --texto: #F4F1F7;
    --suave: #8E8898;
    --linea: #2A2730;
    --lavanda: #C9B6E4;
    --lavanda-hover: #DCCDF0;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html { background: var(--negro); }
  body {
    background: var(--negro);
    color: var(--texto);
    font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: 1.0625rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--lavanda);
    outline-offset: 4px;
  }
  img { max-width: 100%; display: block; }

  .contenedor {
    width: min(100% - 2.5rem, 68rem);
    margin-inline: auto;
  }

  /* Portada */
  .portada {
    padding-block: 1.75rem 3.5rem;
  }
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: clamp(3rem, 9vw, 6.5rem);
  }
  .nav-monograma { width: 2.75rem; height: 2.75rem; }
  .nav a { text-decoration: none; }
  .nav-derecha {
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }
  .nav-ig {
    display: inline-grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    border: 1px solid var(--linea);
    border-radius: 50%;
    transition: border-color .2s ease, color .2s ease;
  }
  .nav-ig:hover { border-color: var(--lavanda); color: var(--lavanda); }
  .nav-ig svg { width: 1.2rem; height: 1.2rem; }
  .marca img {
    width: 100%;
    height: auto;
  }
  .lema {
    margin-top: 1.5rem;
    font-weight: 300;
    font-size: clamp(1.15rem, 2.4vw, 1.6rem);
    color: var(--texto);
    max-width: 30ch;
  }

  @media (prefers-reduced-motion: no-preference) {
    .marca img { animation: aparecer 1.6s cubic-bezier(.2,.7,.1,1) both; }
    .lema { animation: fundido 1s .9s ease both; }
    @keyframes aparecer {
      from { opacity: 0; transform: scale(1.04); filter: blur(8px); }
      to   { opacity: 1; transform: none; filter: none; }
    }
    @keyframes fundido { from { opacity: 0; } to { opacity: 1; } }
  }

  /* Próxima fiesta */
  .proxima {
    border-top: 1px solid var(--linea);
    padding-block: 3.5rem;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2rem 3rem;
    align-items: end;
  }
  .seccion-titulo {
    font-size: 1rem;
    font-weight: 500;
    color: var(--suave);
    margin-bottom: 1.25rem;
  }
  .proxima.con-cartel { grid-template-columns: 11rem minmax(0, 1fr) auto; }
  .cartel {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 4px;
  }
  .proxima-fecha {
    font-weight: 800;
    font-size: clamp(2.2rem, 6vw, 4rem);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .proxima-nombre {
    font-weight: 300;
    font-size: clamp(1.3rem, 3vw, 1.9rem);
    margin-top: 0.75rem;
  }
  .proxima-lugar {
    color: var(--suave);
    margin-top: 0.5rem;
  }
  .mapa {
    display: inline-flex;
    align-items: flex-start;
    gap: 0.4rem;
    margin-top: 0.6rem;
    color: var(--texto);
    font-size: 0.95rem;
    text-decoration: underline;
    text-decoration-color: var(--linea);
    text-underline-offset: 0.3em;
    transition: text-decoration-color .2s ease;
  }
  .mapa:hover { text-decoration-color: var(--lavanda); }
  .mapa svg { width: 1rem; height: 1rem; flex: none; margin-top: 0.2em; color: var(--lavanda); }
  .fila-lugar a { color: inherit; font-weight: 400; text-decoration-color: var(--linea); }
  .media { position: relative; }
  .media video {
    display: block;
    width: 100%;
    aspect-ratio: 9 / 16;
    object-fit: cover;
    border-radius: 4px;
    background: #161419;
  }
  .sonido {
    position: absolute;
    right: 0.6rem;
    bottom: 0.6rem;
    width: 2.25rem;
    height: 2.25rem;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .sonido svg { width: 1.1rem; height: 1.1rem; }
  .boton {
    display: inline-block;
    background: var(--lavanda);
    color: var(--negro);
    font-weight: 500;
    font-size: 1.05rem;
    text-decoration: none;
    padding: 1.05rem 2rem;
    border-radius: 999px;
    white-space: nowrap;
    transition: background .2s ease;
  }
  .boton:hover { background: var(--lavanda-hover); }
  .boton[aria-disabled="true"] {
    background: transparent;
    color: var(--suave);
    border: 1px solid var(--linea);
    pointer-events: none;
  }

  /* Más fechas */
  .fechas { padding-block: 1rem 4rem; }
  .lista { list-style: none; border-top: 1px solid var(--linea); }
  .fila {
    display: grid;
    grid-template-columns: 9rem minmax(0, 1fr) auto;
    gap: 0.25rem 2rem;
    align-items: baseline;
    padding-block: 1.25rem;
    border-bottom: 1px solid var(--linea);
  }
  .fila-fecha { font-weight: 500; }
  .fila-lugar { color: var(--suave); font-size: 0.95rem; }
  .fila a {
    color: var(--lavanda);
    text-underline-offset: 0.25em;
    font-weight: 500;
  }
  .fila .sin-link { color: var(--suave); font-size: 0.95rem; }
  .vacio { color: var(--suave); padding-block: 1.25rem; }

  /* Instagram */
  .insta { padding-block: 1rem 4.5rem; }
  .insta[hidden] { display: none; }
  .insta-cabecera {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }
  .insta-cabecera a {
    color: var(--lavanda);
    font-weight: 500;
    text-underline-offset: 0.25em;
  }
  .insta-grid {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 6px;
  }
  @media (max-width: 52rem) {
    .insta-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  .insta-grid a {
    position: relative;
    display: block;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: #161419;
  }
  .insta-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.1,1);
  }
  .insta-grid img.cargada { opacity: 1; }
  .insta-grid a:hover img { transform: scale(1.04); }
  .insta-grid a::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0);
    transition: background .4s ease;
  }
  .insta-grid a:hover::after { background: rgba(0, 0, 0, 0.18); }
  .insta-tipo {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    width: 1.15rem;
    height: 1.15rem;
    color: #fff;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
    z-index: 1;
  }
  .insta-hueco {
    aspect-ratio: 4 / 5;
    background: #161419;
  }
  @media (prefers-reduced-motion: no-preference) {
    .insta-hueco { animation: latido 1.4s ease-in-out infinite alternate; }
    @keyframes latido { from { opacity: .55; } to { opacity: 1; } }
  }
  @media (prefers-reduced-motion: reduce) {
    .insta-grid img, .insta-grid a::after { transition: none; }
    .insta-grid a:hover img { transform: none; }
  }

  /* Pie */
  .pie {
    border-top: 1px solid var(--linea);
    padding-block: 2.5rem 3rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 1rem 2rem;
    color: var(--suave);
    font-size: 0.95rem;
  }
  .pie nav { display: flex; gap: 1.75rem; flex-wrap: wrap; }
  .pie a { text-underline-offset: 0.25em; }
  .pie a:hover { color: var(--texto); }

  @media (max-width: 40rem) {
    .proxima, .proxima.con-cartel { grid-template-columns: 1fr; }
    .cartel { width: 60%; }
    .boton { text-align: center; width: 100%; }
    .fila { grid-template-columns: 1fr auto; }
    .fila-fecha { grid-column: 1 / -1; }
    .insta-grid { gap: 3px; }
  }
</style>
</head>
<body>

/* =========================================================

   ========================================================= */
const SITIO = {
  lema: "Fiestas para la comunidad FLINTA, en Barcelona.",
  instagram: "https://www.instagram.com/la.blanchett/",
  email: "lablanchett.bcn@gmail.com",
  // Feed de Instagram (Behold) y cuántas fotos mostrar
  feedInstagram: "https://feeds.behold.so/FlnNI8vIoSpmCL6OMUYK",
  fotosInstagram: 6,
};

/* Cada fiesta es un bloque { ... }.
   - fecha: año-mes-día y hora, formato "2026-11-14T23:00"
   - fin: hora de cierre, opcional (por ejemplo "03:00")
   - dj: opcional
   - entradas: la URL del evento en Entradium (o "" si aún no está a la venta)
   - direccion: dirección completa, opcional (enlaza a Google Maps)
   - cartel: imagen del cartel, opcional
   - video: vídeo promocional, opcional (se muestra en lugar del cartel)
   Las fechas que ya pasaron se ocultan solas. La más cercana
   aparece destacada arriba. */
const FIESTAS = [
  {
    nombre: "¡Halloween!",
    dj: "DJ Anabel",
    fecha: "2026-10-30T22:00",
    fin: "03:00",
    lugar: "Rufián",
    direccion: "Carrer Nou de la Rambla, 123, Sants-Montjuïc, 08004 Barcelona",
    entradas: "https://entradium.com/es/events/la-blanchett-halloween",
    cartel: CARTEL_HALLOWEEN,
    video: VIDEO_HALLOWEEN,
  },
  {
    nombre: "La Blanchett Navidad",
    fecha: "2026-12-19T23:00",
    lugar: "Sala por confirmar, Barcelona",
    entradas: "",
  },
  {
    nombre: "Fin de año",
    fecha: "2026-12-31T23:59",
    lugar: "Sala por confirmar, Barcelona",
    entradas: "",
  },
];
/* ========================================================= */


const fmtDia = new Intl.DateTimeFormat("es", { weekday: "short", day: "numeric", month: "short" });
const fmtHora = new Intl.DateTimeFormat("es", { hour: "2-digit", minute: "2-digit" });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const limpiar = s => s.replace(/\./g, "");

const ICONO_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const ICONO_MUDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/></svg>';
const ICONO_SONIDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

function mapa(f) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${f.lugar}, ${f.direccion}`);
}

function horario(f) {
  const ini = fmtHora.format(f.d);
  return f.fin ? `de ${ini} a ${f.fin}` : `desde las ${ini}`;
}

function esc(t) {
  const d = document.createElement("div");
  d.textContent = t;
  return d.innerHTML;
}

// Una fiesta se considera pasada 8 horas después de empezar
const ahora = Date.now();
const futuras = FIESTAS
  .map(f => ({ ...f, d: new Date(f.fecha) }))
  .filter(f => !isNaN(f.d) && f.d.getTime() + 8 * 3600e3 > ahora)
  .sort((a, b) => a.d - b.d);

document.getElementById("lema").textContent = SITIO.lema;

// Barra de arriba: Instagram
const navIg = document.getElementById("nav-ig");
if (SITIO.instagram) navIg.href = SITIO.instagram;
else navIg.hidden = true;


const proxima = document.getElementById("proxima");
const [primera, ...resto] = futuras;

if (primera) {
  const boton = primera.entradas
    ? `<a class="boton" href="${esc(primera.entradas)}" target="_blank" rel="noopener">Comprar entradas</a>`
    : `<span class="boton" aria-disabled="true">Entradas pronto</span>`;
  if (primera.cartel || primera.video) proxima.classList.add("con-cartel");
  const media = primera.video
    ? `<div class="media">
        <video src="${primera.video}" ${primera.cartel ? `poster="${primera.cartel}"` : ""} muted loop playsinline preload="metadata" aria-label="Vídeo de ${esc(primera.nombre)}"></video>
        <button class="sonido" type="button" aria-label="Activar sonido">${ICONO_MUDO}</button>
      </div>`
    : primera.cartel
      ? `<img class="cartel" src="${primera.cartel}" alt="Cartel de ${esc(primera.nombre)}">`
      : "";
  proxima.innerHTML = `
    ${media}
    <div>
      <h2 class="seccion-titulo" id="titulo-proxima">Próxima fiesta</h2>
      <p class="proxima-fecha">${cap(limpiar(fmtDia.format(primera.d)))}</p>
      <p class="proxima-nombre">${esc(primera.nombre)}${primera.dj ? ` con ${esc(primera.dj)}` : ""}</p>
      <p class="proxima-lugar">${esc(primera.lugar)}, ${horario(primera)}</p>
      ${primera.direccion ? `<a class="mapa" href="${mapa(primera)}" target="_blank" rel="noopener">${ICONO_PIN}<span>${esc(primera.direccion)}</span></a>` : ""}
    </div>
    <div>${boton}</div>`;
} else {
  proxima.innerHTML = `
    <div>
      <h2 class="seccion-titulo" id="titulo-proxima">Próxima fiesta</h2>
      <p class="proxima-nombre">Estamos preparando la próxima. Síguenos en Instagram para enterarte primero.</p>
    </div>`;
}

// Vídeo: se reproduce en silencio; el botón activa el sonido
const video = proxima.querySelector("video");
if (video) {
  const quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const boton = proxima.querySelector(".sonido");
  const usarControles = () => { video.controls = true; boton.hidden = true; };
  if (quieto) usarControles();
  else video.play().catch(usarControles);
  boton.addEventListener("click", () => {
    video.muted = !video.muted;
    if (!video.muted) video.play();
    boton.innerHTML = video.muted ? ICONO_MUDO : ICONO_SONIDO;
    boton.setAttribute("aria-label", video.muted ? "Activar sonido" : "Silenciar");
  });
}

const lista = document.getElementById("lista");
if (resto.length) {
  lista.innerHTML = resto.map(f => `
    <li class="fila">
      <span class="fila-fecha">${cap(limpiar(fmtDia.format(f.d)))}</span>
      <span>
        ${esc(f.nombre)}<br>
        <span class="fila-lugar">${f.direccion
          ? `<a href="${mapa(f)}" target="_blank" rel="noopener">${esc(f.lugar)}</a>`
          : esc(f.lugar)}</span>
      </span>
      ${f.entradas
        ? `<a href="${esc(f.entradas)}" target="_blank" rel="noopener">Entradas</a>`
        : `<span class="sin-link">Pronto</span>`}
    </li>`).join("");
} else {
  lista.innerHTML = `<li class="vacio">Nuevas fechas muy pronto.</li>`;
}

document.getElementById("copy").textContent = `© ${new Date().getFullYear()} La Blanchett`;
const redes = [];
if (SITIO.instagram) redes.push(`<a href="${esc(SITIO.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
if (SITIO.email) redes.push(`<a href="mailto:${esc(SITIO.email)}">${esc(SITIO.email)}</a>`);
document.getElementById("redes").innerHTML = redes.join("");

/* Feed de Instagram */
(function () {
  const seccion = document.getElementById("insta");
  const grid = document.getElementById("insta-grid");
  if (!SITIO.feedInstagram) { seccion.hidden = true; return; }

  document.getElementById("insta-perfil").href = SITIO.instagram || "#";
  const n = SITIO.fotosInstagram || 6;
  grid.innerHTML = Array.from({ length: n }, () => `<li class="insta-hueco" aria-hidden="true"></li>`).join("");

  const ICONOS = {
    VIDEO: '<svg class="insta-tipo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
    CAROUSEL_ALBUM: '<svg class="insta-tipo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>',
  };

  fetch(SITIO.feedInstagram)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(datos => {
      const posts = (Array.isArray(datos) ? datos : datos.posts || []).slice(0, n);
      if (!posts.length) throw new Error("sin publicaciones");
      grid.innerHTML = posts.map(p => {
        const tam = p.sizes && (p.sizes.medium || p.sizes.large);
        const src = (tam && tam.mediaUrl) || (p.mediaType === "VIDEO" ? p.thumbnailUrl : p.mediaUrl);
        const texto = (p.altText || p.prunedCaption || p.caption || "Publicación de La Blanchett en Instagram").slice(0, 140);
        return `<li>
          <a href="${esc(p.permalink)}" target="_blank" rel="noopener">
            ${ICONOS[p.mediaType] || ""}
            <img src="${esc(src)}" alt="${esc(texto)}" loading="lazy" decoding="async" onload="this.classList.add('cargada')">
          </a>
        </li>`;
      }).join("");
    })
    .catch(() => { seccion.hidden = true; });
})();

</script>
</body>
</html>
